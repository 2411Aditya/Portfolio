<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aditya Kulkarni | Portfolio</title>
  <script>
    // GitHub Pages SPA redirect trick
    // When GitHub Pages 404s on a path like /Portfolio/admin,
    // this script redirects to /?/admin so index.html loads and restores the path.
    var segmentsToKeep = 1; // Keep /Portfolio as the base segment
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
