name: Keep Backend Alive

on:
  schedule:
    # Trigger every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render Backend
        run: |
          curl -s -f -m 30 "https://portfolio-admin-backend-l78p.onrender.com/api/portfolio/health" || echo "Ping attempted"
